# Garde le projet Supabase gratuit actif : il est mis en pause après environ 7 jours sans activité.
# Envoie un petit appel à la base tous les 2 jours. Aucune donnée n'est lue ni modifiée.
#
# Fichier à placer dans : .github/workflows/keep-alive.yml
#
# Secrets du dépôt à créer (Settings > Secrets and variables > Actions) :
#   SUPABASE_URL              adresse du projet (https://xxxxxxxx.supabase.co)
#   SUPABASE_PUBLISHABLE_KEY  clé publique (sb_publishable_...), JAMAIS la clé secrète ni service_role

name: Keep Supabase alive

on:
  schedule:
    - cron: "17 6 */2 * *"   # tous les 2 jours, vers 6 h 17 (UTC)
  workflow_dispatch:          # lancement manuel possible depuis l'onglet Actions

# Droits minimaux : ce workflow ne lit même pas le code du dépôt.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          status=$(curl --silent --show-error --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 5 \
            --request POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            --header "apikey: $SUPABASE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}')

          echo "HTTP $status"

          # Tout autre code que 200 fait échouer le workflow : GitHub envoie alors un e-mail.
          [ "$status" = "200" ]
